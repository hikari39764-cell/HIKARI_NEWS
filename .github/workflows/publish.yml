# 发布端：把 Claude 研究好的结果（claude/inbox-* 分支）发到 Discord 和 Firebase。
#
# 安全设计：
# - 这个 workflow 只由定时（schedule）或手动触发，所以永远使用 main 分支上的代码。
#   claude/inbox-* 分支里的文件只会被当作「数据」读取，不会执行其中的任何代码。
# - 密钥只存在 GitHub Secrets 里，研究端（Claude 定时任务）完全接触不到。
name: Publish HIKARI NEWS

on:
  schedule:
    # UTC 时间。日本时间 10:05 / 10:25 / 10:45、17:05 / 17:25 / 17:45、22:05 / 22:25 / 22:45
    - cron: "5,25,45 1,8,13 * * *"
    # 日本时间 7:05 / 7:35：夜间学习任务（6:30 开始）的题目・お題・分区新闻
    - cron: "5,35 22 * * *"
    # 日本时间 19:05 / 19:35：19:00 特集（备用）
    - cron: "5,35 10 * * *"
  # 主要的触发方式：发布任务（Claude 定时任务）在 6:56 / 9:56 / 16:56 / 18:56 / 21:56 按下「运行」，
  # 这个流程准备好之后等到整点（7:00 / 10:00 / 17:00 / 19:00 / 22:00）准时发出。上面的 schedule 只是备用。
  workflow_dispatch:
    inputs:
      now:
        description: "不等公开时间，马上发布所有待发布的稿"
        type: boolean
        default: false

permissions:
  contents: write   # 更新 state/published.json、删除已处理的 inbox 分支

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # 整点前触发时，会在里面等最多 10 分钟
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q -r requirements.txt

      - name: Publish pending batches
        env:
          DISCORD_FORUM_WEBHOOK: ${{ secrets.DISCORD_FORUM_WEBHOOK }}
          DISCORD_LOG_WEBHOOK: ${{ secrets.DISCORD_LOG_WEBHOOK }}
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          # メール配信（受け取り設定）。Apps Script の中継（優先）か Gmail のアプリ パスワード。未設定ならメールだけスキップ
          MAIL_RELAY_URL: ${{ secrets.MAIL_RELAY_URL }}
          MAIL_RELAY_TOKEN: ${{ secrets.MAIL_RELAY_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PUBLISH_NOW: ${{ inputs.now && '1' || '' }}
        run: python radar.py publish-pending ${PUBLISH_NOW:+--now}

      - name: Save state
        if: always()
        run: |
          git config user.name "hikari-news-publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add state/published.json
          if git diff --cached --quiet; then
            echo "state unchanged"
            exit 0
          fi
          git commit -m "state: update published list"
          # 整点まで待っている間に main が進むことがある（誰かが push した）。最新の main に載せ直してから push し、だめなら数回やり直す
          for i in 1 2 3 4; do
            if git pull --rebase -q origin main && git push origin HEAD:main; then exit 0; fi
            echo "push failed (try $i), retrying"
            sleep $((i * 5))
          done
          exit 1
