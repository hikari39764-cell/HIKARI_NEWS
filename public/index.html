<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HIKARI NEWS</title>
<meta name="theme-color" content="#07080c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
<script>
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>

<header class="hdr">
  <a class="logo" href="#/today" aria-label="HIKARI NEWS"><b>HIKARI</b><i>NEWS</i></a>
  <nav class="nav" id="nav" hidden>
    <span class="ind" id="ind"></span>
    <a href="#/today" data-r="today"><span>今日</span></a>
    <a href="#/search" data-r="search"><span>さがす</span></a>
    <a href="#/chance" data-r="chance"><span>チャンス</span></a>
    <a href="#/saved" data-r="saved"><span>マイページ</span></a>
    <a href="#/admin" data-r="admin" id="nav-admin" hidden><span>管理<b class="badge" id="admin-badge" hidden></b></span></a>
  </nav>
  <span class="sp"></span>
  <button class="kbtn" id="open-pal" hidden><i class="ti ti-search"></i><span>記事を検索</span><kbd>CTRL K</kbd></button>
  <button class="iconbtn" id="theme" title="ライト／ダーク切り替え"><i class="ti ti-moon-stars"></i></button>
  <div class="me" id="me" hidden>
    <img id="me-photo" alt="" referrerpolicy="no-referrer">
    <button class="iconbtn" id="logout" title="ログアウト"><i class="ti ti-logout"></i></button>
  </div>
</header>

<main id="view"></main>

<nav class="bnav" id="bnav" hidden>
  <a href="#/today" data-r="today"><i class="ti ti-sun"></i>今日</a>
  <a href="#/search" data-r="search"><i class="ti ti-search"></i>さがす</a>
  <a href="#/chance" data-r="chance"><i class="ti ti-flag"></i>チャンス</a>
  <a href="#/saved" data-r="saved"><i class="ti ti-bookmark"></i>マイページ</a>
</nav>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="pal-wrap" id="pal" hidden>
  <div class="scrim on" data-close-pal></div>
  <div class="pal" role="dialog" aria-label="記事を検索">
    <input type="search" id="pal-q" placeholder="キーワード・タグ・サイト名で検索…" autocomplete="off">
    <ul id="pal-list"></ul>
    <div class="foot"><span>↑↓ 移動</span><span>Enter 開く</span><span>Esc 閉じる</span><span id="pal-all" style="margin-left:auto;cursor:pointer;color:var(--flare)">すべての結果を見る →</span></div>
  </div>
</div>
<div class="wipe" id="wipe" hidden><i></i><i></i><i></i></div>

<script type="module" src="app.js"></script>
</body>
</html>
