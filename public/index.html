<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HIKARI NEWS</title>
<meta name="theme-color" content="#08090d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,4 61,37 96,37 68,58 79,92 50,72 21,92 32,58 4,37 39,37' fill='%23f2f56a' stroke='%230b0b0b' stroke-width='6' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500;700;800;900&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
<script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>

<header class="hdr" id="hdr">
  <a class="brand" href="#/today" id="brand" aria-label="HIKARI NEWS"><span id="brand-logo"></span><span class="wm">HIKARI <b>NEWS</b></span></a>
  <nav class="nav" id="nav" hidden>
    <span class="ind" id="ind"></span>
    <a href="#/today" data-r="today" data-tip="今日" data-tip-pos="bottom"><i class="ti ti-sun"></i><span class="lbl">今日</span></a>
    <a href="#/special" data-r="special" id="nav-special" data-tip="19:00 特集" data-tip-pos="bottom" hidden><i class="ti ti-moon-stars"></i><span class="lbl">特集</span></a>
    <a href="#/search" data-r="search" data-tip="さがす" data-tip-pos="bottom"><i class="ti ti-search"></i><span class="lbl">さがす</span></a>
    <a href="#/prog" data-r="prog" data-tip="プログラマー" data-tip-pos="bottom"><i class="ti ti-terminal-2"></i><span class="lbl">プログラマー</span></a>
    <a href="#/plan" data-r="plan" data-tip="プランナー" data-tip-pos="bottom"><i class="ti ti-notebook"></i><span class="lbl">プランナー</span></a>
    <a href="#/chance" data-r="chance" data-tip="チャンス" data-tip-pos="bottom"><i class="ti ti-trophy"></i><span class="lbl">チャンス</span></a>
    <a href="#/saved" data-r="saved" data-tip="マイページ" data-tip-pos="bottom"><i class="ti ti-bookmarks"></i><span class="lbl">マイページ</span></a>
    <a href="#/admin" data-r="admin" id="nav-admin" data-tip="管理" data-tip-pos="bottom" hidden><i class="ti ti-shield-check"></i><span class="lbl">管理</span><b class="badge" id="admin-badge" hidden></b></a>
  </nav>
  <span class="sp"></span>
  <div class="tools">
    <button class="ib" id="open-pal" data-tip="検索" data-tip-pos="bottom" hidden><i class="ti ti-search"></i><kbd>⌘K</kbd></button>
    <a class="ib" href="#/notify" id="notify-btn" data-tip="受け取り設定（メール・Discord）" data-tip-pos="bottom"><i class="ti ti-bell-ringing"></i></a>
    <button class="ib" id="theme" data-tip="ライト／ダーク" data-tip-pos="bottom"><i class="ti ti-moon-stars"></i></button>
    <button class="ib" id="login-btn" data-tip="ログイン（記録を同期）" data-tip-pos="bottom" hidden><i class="ti ti-login"></i></button>
    <span id="me" hidden><button class="ib" id="logout" data-tip="ログアウト" data-tip-pos="bottom"><img id="me-photo" alt="" referrerpolicy="no-referrer" style="width:26px;height:26px;border-radius:8px;object-fit:cover"></button></span>
  </div>
  <span class="prog" id="prog"></span>
</header>

<main id="view"></main>

<footer class="site-foot" id="foot" hidden>
  <nav><a href="#/notify"><i class="ti ti-bell-ringing"></i>受け取り設定（メール・Discord）</a><a href="#/about"><i class="ti ti-info-circle"></i>このサイトについて</a><a href="#/about?f=1"><i class="ti ti-mail-forward"></i>掲載の取り下げ・訂正</a></nav>
  <small>記事の要約・解説は AI が作成しています。正確な内容は原文でご確認ください。紹介記事の著作権は各著作者に帰属します。</small>
</footer>

<nav class="bnav" id="bnav" hidden>
  <a href="#/today" data-r="today" aria-label="今日"><i class="ti ti-sun"></i></a>
  <a href="#/search" data-r="search" aria-label="さがす"><i class="ti ti-search"></i></a>
  <a href="#/prog" data-r="prog" aria-label="プログラマー"><i class="ti ti-terminal-2"></i></a>
  <a href="#/plan" data-r="plan" aria-label="プランナー"><i class="ti ti-notebook"></i></a>
  <a href="#/chance" data-r="chance" aria-label="チャンス"><i class="ti ti-trophy"></i></a>
  <a href="#/saved" data-r="saved" aria-label="マイページ"><i class="ti ti-bookmarks"></i></a>
</nav>

<button class="ib totop" id="totop" data-tip="トップへ"><i class="ti ti-arrow-up"></i></button>
<div class="scrim" id="scrim"></div>
<div class="slash" id="slash" aria-hidden="true"></div>
<div class="plate" id="plate" aria-hidden="true"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="pal-wrap" id="pal" hidden>
  <div class="scrim on" data-close-pal></div>
  <div class="pal" role="dialog" aria-label="検索">
    <div class="pin"><i class="ti ti-search"></i><input type="search" id="pal-q" placeholder="キーワード・タグ・サイト名" autocomplete="off"></div>
    <ul id="pal-list"></ul>
    <div class="foot"><span><kbd>↑↓</kbd> 選ぶ</span><span><kbd>Enter</kbd> 開く</span><span><kbd>Esc</kbd> 閉じる</span>
      <button class="ib sm ghost" id="pal-all" data-tip="すべての結果" style="margin-left:auto"><i class="ti ti-list-search"></i></button></div>
  </div>
</div>
<div class="wipe" id="wipe" hidden><i></i><i></i><i></i><span class="mark" id="wipe-mark"></span></div>

<script type="module" src="app.js"></script>
</body>
</html>
